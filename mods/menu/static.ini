handling=4
brakes=4
bonus=1

[car7]
name=DeLorean
carbitmap=car_del
; geschat (geen originele waarden): zwaar (1500 kg in Car_cfg.ini)
speed=4
accell=3
handling=3
brakes=4
bonus=1

; De aanhangers: <i>=RefName in Car_cfg.ini (of NONE),naam op de knop,plaatje.
; De plaatjes maakt tools/make_mod_assets.py (mods/menu/local).
[TRAILERS]
COUNT=4
0=NONE,geen,
1=CARAVAN,tokkie,trl_car
