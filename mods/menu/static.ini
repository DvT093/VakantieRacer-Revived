; Port: de autoselector en de aanhangers. Sleutel voor sleutel over
; MenuData/static.ini gelegd (zie CLAUDE.md "Menu-mods").
;
; [carN]: N = autonummer in Car_cfg.ini (game.ini [PLAYER] CAR/VEHICLE).
;   name, carbitmap (de auto alleen, 297x227), de balken (zelfde schaal als
;   de karakters), trailer = de eigen aanhanger van dit auto-slot (zoals
;   init_player_car hem kiest), bonus=1: pas open als alle karakters de
;   Vakantie Race gewonnen hebben, of met "Alles vrij".
;   CAR_FER/CAR_Z3/CAR_DEL maakt tools/make_mod_assets.py uit je eigen CD
;   (mods/menu/local, niet in git).
[car0]
name=Ami
carbitmap=car_joh
speed=5
accell=1
handling=2
brakes=1
trailer=CARAVAN

[car1]
name=Camper
carbitmap=car_oud
speed=4
accell=3
handling=2
brakes=1

[car2]
name=2CV
carbitmap=car_hip
speed=1
accell=2
handling=5
brakes=5
trailer=VOUWWAGEN

[car3]
